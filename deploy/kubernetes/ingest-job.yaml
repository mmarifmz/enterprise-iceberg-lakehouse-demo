apiVersion: v1
kind: ConfigMap
metadata: {name: ingestion-code, namespace: lakehouse}
data:
  ingest_adventureworks.py: |
    # Mounted from the repository by CI/release tooling in the next implementation tranche.
    raise RuntimeError("Build the demo Spark image before running ingestion; see images/spark/Dockerfile")
---
apiVersion: batch/v1
kind: Job
metadata: {name: adventureworks-ingest, namespace: lakehouse}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: spark
          image: enterprise-iceberg-demo/spark:local
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-submit"]
          args:
            - --master
            - local[*]
            - --packages
            - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0,org.apache.iceberg:iceberg-aws-bundle:1.10.0
            - /opt/demo/jobs/ingest_adventureworks.py
          env:
            - {name: ICEBERG_REST_URI, value: "http://iceberg-rest:8181"}
            - {name: S3_ENDPOINT, value: "http://minio:9000"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-user}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-password}}
