apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-07-23T15-54-02Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-password}}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: lakehouse}
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: api, nodePort: 30900}
    - {name: console, port: 9001, targetPort: console, nodePort: 30901}
  type: NodePort
---
apiVersion: batch/v1
kind: Job
metadata: {name: minio-bootstrap, namespace: lakehouse}
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-07-21T05-28-08Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-password}}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
              mc mb --ignore-existing local/warehouse;
              mc anonymous set none local/warehouse
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: iceberg-rest, namespace: lakehouse}
spec:
  replicas: 1
  selector:
    matchLabels: {app: iceberg-rest}
  template:
    metadata:
      labels: {app: iceberg-rest}
    spec:
      containers:
        - name: iceberg-rest
          image: apache/iceberg-rest-fixture:1.10.0
          env:
            - {name: CATALOG_WAREHOUSE, value: "s3://warehouse/"}
            - {name: CATALOG_IO__IMPL, value: "org.apache.iceberg.aws.s3.S3FileIO"}
            - {name: CATALOG_S3_ENDPOINT, value: "http://minio:9000"}
            - {name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-user}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-password}}
            - {name: AWS_REGION, value: "us-east-1"}
          ports: [{name: http, containerPort: 8181}]
          readinessProbe:
            httpGet: {path: /v1/config, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: iceberg-rest, namespace: lakehouse}
spec:
  selector: {app: iceberg-rest}
  ports: [{name: http, port: 8181, targetPort: http, nodePort: 30181}]
  type: NodePort
---
apiVersion: v1
kind: ConfigMap
metadata: {name: trino-catalog, namespace: lakehouse}
data:
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://iceberg-rest:8181
    iceberg.rest-catalog.warehouse=s3://warehouse/
    fs.s3.enabled=true
    s3.endpoint=http://minio:9000
    s3.region=us-east-1
    s3.path-style-access=true
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trino, namespace: lakehouse}
spec:
  replicas: 1
  selector:
    matchLabels: {app: trino}
  template:
    metadata:
      labels: {app: trino}
    spec:
      containers:
        - name: trino
          image: trinodb/trino:483
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-user}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: lakehouse-secrets, key: minio-root-password}}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: catalog, mountPath: /etc/trino/catalog/iceberg.properties, subPath: iceberg.properties}
          readinessProbe:
            httpGet: {path: /v1/info, port: http}
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: catalog
          configMap: {name: trino-catalog}
---
apiVersion: v1
kind: Service
metadata: {name: trino, namespace: lakehouse}
spec:
  selector: {app: trino}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30081}]
  type: NodePort
